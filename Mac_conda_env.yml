name: lasermpnn
channels:
  - conda-forge
  - pyg
  - defaults
dependencies:
- python=3.14
- pip
# conda-forge's osx-arm64 pytorch build is cpu_generic-only: torch.backends.mps.is_available()
# reports True but actually running an op on 'mps' crashes. Install pytorch via pip instead (see
# below) to get a real MPS/Metal-accelerated build.
- libblas=*=*accelerate  # avoids an OpenMP runtime clash between pip-installed pytorch (bundles
                          # its own libomp) and conda's openblas-linked numpy/scipy (also linked
                          # against libomp) -- without this, importing torch + numpy in the same
                          # process aborts with "OMP: Error #15".
- scipy
- numpy
- pandas
- rdkit
- scikit-learn
- biopython
- h5py
- pytest
- matplotlib
- seaborn
- jupyter
- plotly
- logomaker
- wandb
- tqdm
- rdkit-to-params
- pip:
  - torch>=2.14
  - pykeops
  - pybind11  # required by pykeops to JIT-compile LazyTensor kernels
  - prody
  - pdbecif
  - pydssp
